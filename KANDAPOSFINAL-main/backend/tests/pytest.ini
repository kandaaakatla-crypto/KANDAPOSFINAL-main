[pytest]
asyncio_mode = auto
# backend/tests/unit/conftest.py does `from server import app` — server.py
# lives in backend/, one level above this ini file. Bare `pytest` (unlike
# `python -m pytest`) does not add the CWD to sys.path on its own.
pythonpath = ..
markers =
    integration: HTTP integration test against a live, already-running
        server (see conftest.py) — needs a seeded demo tenant reachable over
        the network. Deselected by default; run explicitly with `-m integration`.
addopts = -m "not integration"
