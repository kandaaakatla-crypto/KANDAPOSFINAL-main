name: Deploy backend to Cloud Run

on:
  push:
    branches: [master]
    paths:
      - "KANDAPOSFINAL-main/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  GCP_REGION: ${{ vars.GCP_REGION }}
  # Cloud Run domain mappings aren't available in asia-south1, so the
  # api.kandapos.com WebSocket domain mapping points at a second copy of
  # this same service deployed in us-central1 instead. Both must be kept
  # on the same image/config or the two regions drift — this is the one
  # place that's deployed.
  WS_REGION: us-central1
  SERVICE_NAME: kanda-pos-backend
  REPO_NAME: kanda-pos

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for google-github-actions/auth via Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # Two supported ways to authenticate — set whichever secret you
          # configured (see the deployment runbook). Workload Identity
          # Federation (no long-lived key) is the recommended one; a
          # service-account JSON key also works and is simpler to set up
          # first, at the cost of a static credential to rotate.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push image
        working-directory: KANDAPOSFINAL-main/backend
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Concurrency/max-instances are tuned per region now that ws.py's Redis
      # pub/sub makes it safe for either region to run more than one
      # instance — before that, extra instances would have silently dropped
      # realtime events for clients connected to a different instance.
      #
      # asia-south1 (API): concurrency capped well below the Cloud Run
      # default of 80 because requests here do real work (order writes,
      # tax/recipe calc, PDF/ESC-POS receipt generation) that contends for
      # the instance's 1 vCPU — better to spin up another instance than let
      # requests queue behind CPU-bound work on an overloaded one.
      #
      # max-instances on both regions is sized so the worst case (every
      # instance in both regions live at once) stays well under MongoDB
      # Atlas M0's ~500 connection ceiling given db.py's maxPoolSize=20:
      # 8*20 + 3*20 = 220 connections, leaving headroom for direct/tooling
      # connections.
      - name: Deploy to Cloud Run (asia-south1 — HTTP API via Firebase Hosting rewrite)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --platform managed \
            --min-instances 1 \
            --max-instances 8 \
            --concurrency 40 \
            --allow-unauthenticated \
            --set-env-vars "DB_NAME=kanda_pos,CORS_ORIGINS=${{ vars.CORS_ORIGINS }},PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }},SENTRY_DSN=${{ vars.SENTRY_DSN_BACKEND }},SENTRY_ENVIRONMENT=production-api,QR_OTP_REQUIRED=${{ vars.QR_OTP_REQUIRED || '0' }},WA_OTP_CONTENT_SID=${{ vars.WA_OTP_CONTENT_SID }},SMS_OTP_ENABLED=${{ vars.SMS_OTP_ENABLED }}" \
            --set-secrets "MONGO_URL=kanda-mongo-url:latest,JWT_SECRET=kanda-jwt-secret:latest,REDIS_URL=kanda-redis-url:latest,ANTHROPIC_API_KEY=kanda-anthropic-key:latest,OPENAI_API_KEY=kanda-openai-key:latest"

      # us-central1 (WebSocket): concurrency raised well above the default —
      # an open WebSocket holds a concurrency slot for its entire connected
      # lifetime but does essentially no CPU work while idle, so one
      # instance can comfortably hold hundreds of idle terminal/KDS
      # connections without needing to scale out just for connection count.
      # --timeout 3600: Cloud Run cuts every request, WebSockets included, at
      # its timeout (default 300s). AI phone calls and POS live updates are
      # WebSockets on this service, so 5 minutes dropped calls mid-order.
      - name: Deploy to Cloud Run (us-central1 — WebSocket via api.kandapos.com domain mapping)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE }}" \
            --region "${{ env.WS_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --platform managed \
            --min-instances 1 \
            --max-instances 3 \
            --concurrency 250 \
            --timeout 3600 \
            --allow-unauthenticated \
            --set-env-vars "DB_NAME=kanda_pos,CORS_ORIGINS=${{ vars.CORS_ORIGINS }},PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }},SENTRY_DSN=${{ vars.SENTRY_DSN_BACKEND }},SENTRY_ENVIRONMENT=production-ws,QR_OTP_REQUIRED=${{ vars.QR_OTP_REQUIRED || '0' }},WA_OTP_CONTENT_SID=${{ vars.WA_OTP_CONTENT_SID }},SMS_OTP_ENABLED=${{ vars.SMS_OTP_ENABLED }}" \
            --set-secrets "MONGO_URL=kanda-mongo-url:latest,JWT_SECRET=kanda-jwt-secret:latest,REDIS_URL=kanda-redis-url:latest,ANTHROPIC_API_KEY=kanda-anthropic-key:latest,OPENAI_API_KEY=kanda-openai-key:latest"
