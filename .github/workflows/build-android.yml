name: Build signed Android AAB

# Tag-triggered rather than on every push to master — an Android release is
# a deliberate, versioned artifact (uploaded to Play Console by hand for
# now), not something to rebuild on every backend/frontend commit the way
# deploy-backend.yml/deploy-frontend.yml do.
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli requires Node >=22 (`npx cap sync android` below
          # fails outright on 20, which is otherwise fine for the plain
          # `npm run build` step).
          node-version: 22

      - name: Install frontend dependencies
        working-directory: KANDAPOSFINAL-main/frontend
        run: npm ci --legacy-peer-deps

      - name: Build web bundle
        working-directory: KANDAPOSFINAL-main/frontend
        env:
          # Points the packaged app at the deployed Cloud Run backend — set
          # this repo variable once the backend's Cloud Run URL is known
          # (same variable deploy-frontend.yml uses).
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          # CRA treats ESLint warnings as build-failing errors whenever CI=true
          # — which GitHub Actions sets by default — even though the exact
          # same warnings don't fail a local `npm run build`. The warnings
          # are pre-existing (unrelated files, not this pipeline's job to fix).
          CI: false
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: KANDAPOSFINAL-main/frontend
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor's own Android library module compiles against Java 21
          # source compatibility — 17 fails with "invalid source release: 21".
          java-version: "21"

      - name: Decode release keystore
        # `if:` can't reference the secrets context directly on this runner
        # ("Unrecognized named-value: 'secrets'") — so this always runs; with
        # no secret configured it just writes an empty file, which is fine
        # since the build step below only points Gradle at it when the
        # secret is actually present (see ANDROID_KEYSTORE_PATH below).
        # app/build.gradle's `file(releaseKeystorePath)` resolves relative
        # to the app/ module's own directory, not the android/ project root
        # — the decoded file has to land here or Gradle reports "Keystore
        # file ... not found" even with a correct path string.
        working-directory: KANDAPOSFINAL-main/frontend/android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build signed release AAB
        working-directory: KANDAPOSFINAL-main/frontend/android
        env:
          # Empty (not just "unset") when the secret is absent — build.gradle's
          # signingConfigs.release block only activates when this is truthy,
          # so a no-secret run produces a normal unsigned bundle instead of
          # failing when Gradle looks for a keystore file that was never
          # written.
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # chmod belt-and-suspenders: gradlew was committed from a Windows
        # checkout, which doesn't track the Unix executable bit, so it can
        # land non-executable on a Linux runner regardless of the repo's
        # actual git file mode.
        # bundleRelease (.aab) is what Play Console wants; assembleRelease
        # (.apk) is what you actually sideload onto a phone directly — an
        # .aab can't be installed on a device without running it through
        # bundletool first. Both share the same signingConfig above.
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Remove decoded keystore
        if: always()
        working-directory: KANDAPOSFINAL-main/frontend/android/app
        run: rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: kanda-pos-release-aab
          path: KANDAPOSFINAL-main/frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: kanda-pos-release-apk
          path: KANDAPOSFINAL-main/frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
