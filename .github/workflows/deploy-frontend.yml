name: Deploy frontend to Firebase Hosting

on:
  push:
    branches: [master]
    paths:
      - "KANDAPOSFINAL-main/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: KANDAPOSFINAL-main/frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: KANDAPOSFINAL-main/frontend
        env:
          # Deliberately empty, NOT ${{ vars.REACT_APP_BACKEND_URL }} — that
          # variable holds an absolute URL the Android/Windows builds need
          # (they have no "same origin" server to resolve a relative path
          # against). The web build takes a different path entirely: empty
          # means client.js/ws.js build relative "/api/..." URLs, which
          # firebase.json's rewrite proxies server-side to the Cloud Run
          # service — same-origin from the browser's perspective, so no
          # CORS, and it routes around the *.run.app default-domain edge
          # bug (see Issue Tracker #547996268) since Firebase Hosting's
          # Cloud Run integration uses a different routing path.
          REACT_APP_BACKEND_URL: ""
          # WebSocket-only override — Firebase Hosting's rewrite doesn't
          # proxy WS upgrades, so realtime needs its own path: a Cloud Run
          # domain mapping (api.kandapos.com -> kanda-pos-backend,
          # us-central1) that isn't affected by that limitation. Everything
          # else keeps using the relative /api/... path above.
          REACT_APP_WS_BACKEND_URL: "https://api.kandapos.com"
          REACT_APP_SENTRY_DSN: ${{ vars.SENTRY_DSN_FRONTEND }}
          REACT_APP_SENTRY_ENVIRONMENT: "production-web"
          # See build-android.yml — CRA fails the build on pre-existing lint
          # warnings when CI=true, which GitHub Actions sets by default.
          CI: false
          # Don't ship .map files publicly — they expose original source
          # (including comments) to anyone who opens devtools. Sentry still
          # gets readable stack traces from its own SDK breadcrumbs; wiring
          # up a separate sourcemap upload step is a follow-up, not this.
          GENERATE_SOURCEMAP: false
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: KANDAPOSFINAL-main/frontend
