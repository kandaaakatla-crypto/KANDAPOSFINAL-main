name: Build Windows Electron installer

# Tag-triggered, same reasoning as build-android.yml — a desktop release is
# a deliberate, versioned artifact, not something to rebuild on every commit.
on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: KANDAPOSFINAL-main/frontend
        run: npm ci --legacy-peer-deps

      - name: Build web bundle
        working-directory: KANDAPOSFINAL-main/frontend
        env:
          # Points the packaged app at the deployed Cloud Run backend — same
          # repo variable deploy-frontend.yml and build-android.yml use.
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          REACT_APP_SENTRY_DSN: ${{ vars.SENTRY_DSN_FRONTEND }}
          REACT_APP_SENTRY_ENVIRONMENT: "production-windows"
          # Opens straight to staff sign-in instead of the marketing
          # homepage — see App.js's RootRoute. This build is "Kanda POS":
          # cashier/driver/clock-in. The back-of-house sibling app
          # (Kitchen Display/Packing/Customer Display) is a separate
          # build+workflow with REACT_APP_APP_TARGET=display instead.
          REACT_APP_APP_TARGET: pos
          # See build-android.yml — CRA fails the build on pre-existing lint
          # warnings when CI=true, which GitHub Actions sets by default.
          CI: false
          # See deploy-frontend.yml — without this, the installer ships
          # full .map files inside the packaged app; anyone who extracts the
          # asar archive gets fully readable original source with comments.
          GENERATE_SOURCEMAP: false
        run: npm run build

      - name: Build Windows installer
        working-directory: KANDAPOSFINAL-main/frontend
        env:
          # electron-builder reads these automatically for Authenticode
          # signing — unset (no cert configured yet) just produces an
          # unsigned installer rather than failing the build. "publish
          # never" here regardless of signing status: electron-builder's own
          # publish mechanism only knows how to push to providers like
          # GitHub/S3, and the update feed (see below) is a plain static
          # site it can't upload to directly — this step's job is just to
          # produce dist-electron/*.exe and latest.yml.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          npx electron-builder --publish never
          if [ -n "$CSC_LINK" ]; then
            echo "HAS_CSC=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kanda-pos-windows-installer
          path: KANDAPOSFINAL-main/frontend/dist-electron/*.exe
          retention-days: 90

      - name: Publish update feed
        # electron-updater's feed (package.json's build.publish) is a
        # dedicated public Firebase Hosting site (kandapos-desktop-releases)
        # decoupled from this private source repo, so installed apps can
        # check for updates without a repo-access token. Only publish once
        # actually signed — an unsigned auto-update install would just get
        # blocked by SmartScreen on end users' machines, so there's no point
        # putting one in front of anyone before a real cert exists.
        if: ${{ env.HAS_CSC == 'true' }}
        working-directory: KANDAPOSFINAL-main/frontend
        shell: bash
        run: |
          mkdir -p electron/release-feed
          cp dist-electron/*.exe dist-electron/latest.yml electron/release-feed/
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config electron/releases-firebase.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
