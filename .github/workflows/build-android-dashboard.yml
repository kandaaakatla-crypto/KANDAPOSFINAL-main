name: Build signed Android AAB (Kanda Dashboard)

# Sibling of build-android.yml / build-android-display.yml for the owner &
# manager phone app — same source tree and Capacitor Android tooling,
# different native project (android-dashboard/, its own applicationId and
# icon) and a REACT_APP_APP_TARGET=dashboard build that opens straight into
# the dashboard. Tag-triggered like the others: a deliberate, versioned
# artifact, not rebuilt on every commit.
on:
  push:
    tags:
      - "android-dashboard-v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: KANDAPOSFINAL-main/frontend
        run: npm ci --legacy-peer-deps

      - name: Build web bundle
        working-directory: KANDAPOSFINAL-main/frontend
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          REACT_APP_SENTRY_DSN: ${{ vars.SENTRY_DSN_FRONTEND }}
          REACT_APP_SENTRY_ENVIRONMENT: "production-android-dashboard"
          # Opens straight into the owner dashboard instead of the
          # marketing homepage — see App.js's RootRoute.
          REACT_APP_APP_TARGET: dashboard
          CI: false
          GENERATE_SOURCEMAP: false
        run: npm run build

      - name: Use Kanda Dashboard Capacitor config
        # The Capacitor CLI only reads capacitor.config.json from the
        # project root (see build-android-display.yml), so swap this app's
        # identity in for the run.
        working-directory: KANDAPOSFINAL-main/frontend
        run: cp capacitor.config.dashboard.json capacitor.config.json

      - name: Sync Capacitor Android project
        working-directory: KANDAPOSFINAL-main/frontend
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode release keystore
        # Same shared "Kanda" signing identity as the other two apps — see
        # build-android.yml for why this step always runs.
        working-directory: KANDAPOSFINAL-main/frontend/android-dashboard/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build signed release AAB
        working-directory: KANDAPOSFINAL-main/frontend/android-dashboard
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Remove decoded keystore
        if: always()
        working-directory: KANDAPOSFINAL-main/frontend/android-dashboard/app
        run: rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: kanda-dashboard-release-aab
          path: KANDAPOSFINAL-main/frontend/android-dashboard/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: kanda-dashboard-release-apk
          path: KANDAPOSFINAL-main/frontend/android-dashboard/app/build/outputs/apk/release/app-release*.apk
          retention-days: 90
